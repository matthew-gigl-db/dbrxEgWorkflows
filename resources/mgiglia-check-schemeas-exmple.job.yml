resources:
  jobs:
    mgiglia_check_schemeas_exmple:
      name: mgiglia-check-schemeas-exmple
      trigger:
        periodic:
          interval: 1
          unit: DAYS
      tasks:
        - task_key: 00_-_Check_Schemas
          notebook_task:
            notebook_path: ../src/migrationTests/00 - Check Schemas.ipynb
            base_parameters:
              source_database: gis
              source_schema: etl
              target_catalog: mgiglia
              target_schema: hv_claims
            warehouse_id: 8baced1ff014912d
      email_notifications:
        no_alert_for_skipped_runs: true
        on_failure:
          - matthew.giglia@databricks.com
      queue:
        enabled: true

